# VidMuse Application Configuration

app:
  name: VidMuse
  version: 0.1.0
  debug: false
  host: 0.0.0.0
  port: 8003

api:
  prefix: /api/v1
  cors_origins:
    - "*"

media:
  ffmpeg_path: '${FFMPEG_PATH}'

talking_head:
  # Story Overview Board / Seedance 视频阶段共用：r1/r2/r3 为默认人物图。
  # story_board_scene_image_path 只是未上传项目级场地图时的兜底图；项目级 scene_reference_asset_id 优先。
  # 本地图片会上传为公网/签名 URL 后再传给外部模型，避免把 asset:// 当作公网图片。
  story_board_reference_image_dir: "data/person_pic"
  story_board_scene_image_path: "data/person_pic/d1.png"
  host_reference_image_assets:
    - "asset://asset-20260506200638-6g86k"
    - "asset://asset-20260506200638-6g86k"
    - "asset://asset-20260506200638-6g86k"

  reference_audio_assets:
    - "asset://asset-20260506202002-hhmgk"
    - "asset://asset-20260506202001-fg589"
    - "asset://asset-20260506202001-hl2kx"
  story_board_aspect_ratio: "21:9"
  segment_duration_sec: 15
  subtitles_enabled: false

jwt:
  # Secret key for signing tokens - injected from env var, never hardcoded
  secret: "${JWT_SECRET}"
  algorithm: HS256
  # Access token expiry in minutes (default: 30 min)
  access_token_expire_minutes: 30
  # Refresh token expiry in days (default: 7 days)
  refresh_token_expire_days: 7
