# OSS Object Storage Configuration

storage:
  # OSS SDK endpoint，例如 https://oss-cn-beijing.aliyuncs.com
  endpoint: "${STORAGE_ENDPOINT}"
  # 资产追溯 URL 基础前缀，例如 https://bucket.oss-cn-beijing.aliyuncs.com
  public_base_url: "${STORAGE_PUBLIC_BASE_URL}"
  access_key: "${STORAGE_ACCESS_KEY}"
  secret_key: "${STORAGE_SECRET_KEY}"
  bucket: "${STORAGE_BUCKET}"

  # 是否使用 HTTPS
  secure: "${STORAGE_SECURE}"

  # 区域设置
  region: "${STORAGE_REGION}"

  # 文件大小限制 (bytes)
  max_upload_size: 104857600  # 100MB

  # 预签名 GET URL 过期时间 (seconds)，OSS 临时 URL 最长 7 天
  presigned_expiry: 604800
